# 在 RT-DETR 编码器中启用潜能图增强（红外空间先验）
# 使用方式：在任务 yml 的 __include__ 中用本文件替换 include/rtdetr_r50vd_X.yml，或在本文件基础上追加/覆盖

task: detection
model: RTDETRX
criterion: SetCriterion
postprocessor: RTDETRPostProcessor

RTDETRX:
  backbone: PResNetX
  encoder: HybridEncoder
  decoder: RTDETRTransformer
  multi_scale: [864, 896, 928, 960, 992, 1024, 1024, 1024, 1056, 1088, 1120, 1152, 1184]

# Backbone 需返回 IR 特征供编码器生成潜能图
PResNetX:
  depth: 50
  variant: d
  freeze_at: 0
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: True
  pretrained: True
  return_ir_feat: True

# 编码器：P3/P4 仅做 F⊙(1+α·G_ir)，P5 跑 Transformer+潜能图；潜能图在 P3 计算，P4/P5 插值
# potential_mode 仅作用于 P5 层
HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  pe_temperature: 10000
  expansion: 1.0
  depth_mult: 1
  act: 'silu'
  eval_spatial_size: [1024, 1024]
  use_potential_map: True
  potential_mode: 'pre'
  potential_ir_channels: 256
  potential_gamma: 0.5
  potential_beta: 0.5

RTDETRTransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3
  num_queries: 300
  num_decoder_layers: 6
  num_denoising: 100
  eval_idx: -1
  eval_spatial_size: [1024, 1024]

use_focal_loss: True
RTDETRPostProcessor:
  num_top_queries: 300

SetCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_potential: 1.0}
  losses: ['vfl', 'boxes', 'potential']
  alpha: 0.75
  gamma: 2.0
  potential_alpha: 0.25
  potential_gamma: 2.0
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
